name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record revision and check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf 'Tested SHA: %s\nPR head: %s\nPR base: %s\n' "$GITHUB_SHA" "$PR_HEAD" "$PR_BASE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: [^[:space:]]'
            if [[ ! "$PR_TITLE" =~ $pattern ]]; then
              echo "::error::Use a Conventional Commit title, for example chore: scaffold the app."
              exit 1
            fi
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm
        id: pnpm
        run: |
          corepack enable
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.node }}-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check size budgets
        run: |
          printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          pnpm size | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  required:
    name: required
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success

  deploy:
    needs: required
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
