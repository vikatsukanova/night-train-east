name: deploy

on:
  workflow_call:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/
      - name: Check main still points to this build
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA because main advanced to $latest."
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: pages
        if: ${{ steps.revision.outputs.current == 'true' }}
      - name: Verify the live build
        if: ${{ steps.revision.outputs.current == 'true' }}
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          entry="$(jq -er 'to_entries[] | select(.value.isEntry) | .value.file' dist/.vite/manifest.json)"
          # Cache-busting query: the Pages CDN may serve the previous index.html for a few minutes.
          bust="nte=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          for attempt in {1..30}; do
            if curl -fsSL --max-time 10 "${PAGE_URL%/}/?$bust" -o "$RUNNER_TEMP/live.html" &&
              cmp -s dist/index.html "$RUNNER_TEMP/live.html" &&
              curl -fsSL --max-time 10 "${PAGE_URL%/}/$entry?$bust" -o "$RUNNER_TEMP/live.js" &&
              cmp -s "dist/$entry" "$RUNNER_TEMP/live.js"; then
              printf 'Deployed %s to %s\n' "$GITHUB_SHA" "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" != 30 ]]; then sleep 10; fi
          done
          echo "::error::The live Pages HTML and entry bundle did not match $GITHUB_SHA."
          exit 1
